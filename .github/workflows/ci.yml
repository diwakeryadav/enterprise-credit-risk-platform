name: Enterprise Credit Risk CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate YAML Configuration
      run: |
        python scripts/validate_yaml.py

    - name: Code Quality - Format Check (Black)
      run: |
        black --check src/

    - name: Code Quality - Import Sorting (isort)
      run: |
        isort --check-only src/

    - name: Code Quality - Style Linting (Flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Code Quality - Static Type Check (Mypy)
      run: |
        mypy --ignore-missing-imports src/

    - name: Run Test Suite (Pytest)
      run: |
        pytest
